name: Release Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Setup Embedded Python Backend Environment
        working-directory: ./lab_sales_spark_backend
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            .\.venv\Scripts\pip install -r requirements.txt
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: lab_sales_spark_frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./lab_sales_spark_frontend
        run: npm ci

      - name: Run Tests
        working-directory: ./lab_sales_spark_frontend
        run: npm run test

      - name: Build Next.js & Electron
        working-directory: ./lab_sales_spark_frontend
        run: |
          npm run build
          npm run build:electron

      - name: Build Standalone Windows Packages
        working-directory: ./lab_sales_spark_frontend
        run: npx electron-builder --win --publish never

      - name: Upload and Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            lab_sales_spark_frontend/dist-package/*.exe
            lab_sales_spark_frontend/dist-package/*.yml
            lab_sales_spark_frontend/dist-package/*.blockmap
            lab_sales_spark_frontend/dist-package/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
